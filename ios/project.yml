name: BookCon
options:
  bundleIdPrefix: com.bookcon
  createIntermediateGroups: true
packages:
  Readium:
    url: https://github.com/readium/swift-toolkit.git
    exactVersion: 3.2.0
targets:
  BookCon:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/BookCon
    dependencies:
      - package: Readium
        products:
          - ReadiumShared
          - ReadiumNavigator
          - ReadiumAdapterGCDWebServer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bookcon.ios
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: BookCon
        CODE_SIGNING_ALLOWED: NO
