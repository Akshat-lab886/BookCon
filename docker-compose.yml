services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bookcon
      POSTGRES_PASSWORD: bookcon
      POSTGRES_DB: bookcon
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookcon"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: bookcon
      MINIO_ROOT_PASSWORD: bookcon-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 bookcon bookcon-secret &&
      mc mb --ignore-existing local/bookcon &&
      mc anonymous set none local/bookcon &&
      exit 0"

  migrate:
    build: ./server
    command: alembic upgrade head
    environment: &appenv
      DATABASE_URL: postgresql+psycopg://bookcon:bookcon@postgres:5432/bookcon
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: bookcon
      S3_ACCESS_KEY: bookcon
      S3_SECRET_KEY: bookcon-secret
      STORAGE_BACKEND: s3
      JWT_SECRET: change-me-in-production
      PUBLIC_BASE_URL: http://localhost:8000
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./server
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment: *appenv
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 10s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
  miniodata:
