[project]
name = "bookcon-server"
version = "1.0.0"
description = "BookCon self-hosted eBook library & sync server"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.40",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    "email-validator>=2.2",
    "boto3>=1.35",
    "pillow>=11.0",
    "pypdf>=5.0",
    "pypdfium2>=4.30",
    "rarfile>=4.2",
    "httpx>=0.27",
    "python-multipart>=0.0.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".uvcache", ".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends(...) in parameter defaults is idiomatic (B008).
"app/api/**" = ["B008"]
"tests/**" = ["E501"]
# Re-export barrel module.
"app/schemas/__init__.py" = ["F401"]
